x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.production}
      APP_DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gameclubfinder-api:local
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # nginx (proxy service) is one hop in front of the API.
      TRUST_PROXY: 1
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.production}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend]

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-./var/certbot}:/var/www/certbot:ro
    networks: [backend]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
